version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cineai-postgres
    environment:
      POSTGRES_DB: cineai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cineai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: cineai-mailpit
    ports:
      - "1025:1025"   # SMTP port (Spring Boot sends emails here)
      - "8025:8025"   # Web UI port (view sent emails in browser)
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
