server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:cineaitest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
